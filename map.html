
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a73e8">
  <title>GPS Location Tracker</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    .map-container {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #e5e3df;
    }

    .control-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1000;
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
      width: 280px;
      max-width: calc(100vw - 70px);
    }

    button {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border: 0;
      border-radius: 5px;
      background: #1a73e8;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    #status {
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      color: #1a73e8;
    }

    #diagnostics {
      display: none;
      margin-top: 10px;
      padding: 8px;
      background: #f5f5f5;
      border-radius: 5px;
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .user-location-dot {
      width: 14px;
      height: 14px;
      background: #1a73e8;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 5px #555;
      position: relative;
      box-sizing: content-box;
    }

    .user-location-dot::after {
      content: "";
      position: absolute;
      inset: -3px;
      border: 3px solid #1a73e8;
      border-radius: 50%;
      animation: pulse-aura 2s infinite ease-out;
      box-sizing: content-box;
    }

    @keyframes pulse-aura {
      0% {
        transform: scale(1);
        opacity: .65;
      }
      100% {
        transform: scale(3.5);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .user-location-dot::after {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div class="map-container">
    <div class="control-panel">
      <button id="locate-button" type="button">
        Locate Me
      </button>

      <div id="status" role="status" aria-live="polite">
        Ready. Tap Locate Me to request your location.
      </div>

      <div style="margin-top:12px; border-top:1px solid #ddd; padding-top:12px;">
        <input
          id="manual-location"
          type="search"
          placeholder="Enter city or ZIP code"
          autocomplete="off"
        >

        <button id="search-button" type="button"
                style="background:#188038;">
          Search Location
        </button>
      </div>

      <button id="diagnostic-button" type="button"
              style="background:#5f6368;">
        Show Diagnostics
      </button>

      <div id="diagnostics"></div>
    </div>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    "use strict";

    const statusText = document.getElementById("status");
    const diagnostics = document.getElementById("diagnostics");
    const locateButton = document.getElementById("locate-button");
    const searchButton = document.getElementById("search-button");
    const diagnosticButton = document.getElementById("diagnostic-button");
    const manualInput = document.getElementById("manual-location");

    let locationMarker = null;
    let accuracyCircle = null;
    let locationRequestInProgress = false;

    const map = L.map("map", {
      zoomControl: false
    }).setView([20, 0], 2);

    L.control.zoom({
      position: "bottomright"
    }).addTo(map);

    // Use the official OpenStreetMap tile endpoint.
    // Follow its usage policy and retain visible attribution.
    L.tileLayer(
      "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">' +
          'OpenStreetMap contributors</a>'
      }
    ).addTo(map);

    function setStatus(message, color = "#1a73e8") {
      statusText.style.color = color;
      statusText.textContent = message;
    }

    function showDiagnostics(info) {
      diagnostics.style.display = "block";
      diagnostics.replaceChildren();

      for (const [key, value] of Object.entries(info)) {
        const line = document.createElement("div");
        line.textContent = key + ": " + String(value);
        diagnostics.appendChild(line);
      }

      console.log("Location diagnostics:", info);
    }

    function getErrorDescription(error) {
      switch (error.code) {
        case 1:
          return "Permission denied. Allow location access for this website.";
        case 2:
          return "Position unavailable. Your device could not determine its location.";
        case 3:
          return "Location timed out. Try again outdoors.";
        default:
          return "An unknown location error occurred.";
      }
    }

    function displayLocationError(error) {
      const info = {
        "Error code": error.code,
        "Error message": error.message || "(no message supplied)",
        "HTTPS / secure context": window.isSecureContext,
        "Page URL": location.href,
        "Browser": navigator.userAgent
      };

      setStatus(getErrorDescription(error), "#d93025");

      if (navigator.permissions &&
          navigator.permissions.query) {
        navigator.permissions.query({ name: "geolocation" })
          .then(result => {
            info["Location permission"] = result.state;
            showDiagnostics(info);
          })
          .catch(() => showDiagnostics(info));
      } else {
        info["Location permission"] = "Permission API unavailable";
        showDiagnostics(info);
      }
    }

    function showPosition(lat, lng, label, accuracy = null) {
      if (!Number.isFinite(lat) ||
          !Number.isFinite(lng) ||
          lat < -90 || lat > 90 ||
          lng < -180 || lng > 180) {
        setStatus("Invalid coordinates received.", "#d93025");
        return;
      }

      map.setView([lat, lng], 17);

      const dotIcon = L.divIcon({
        className: "user-location-dot",
        iconSize: [20, 20],
        iconAnchor: [10, 10]
      });

      if (locationMarker) {
        map.removeLayer(locationMarker);
      }

      if (accuracyCircle) {
        map.removeLayer(accuracyCircle);
        accuracyCircle = null;
      }

      locationMarker = L.marker([lat, lng], {
        icon: dotIcon
      }).addTo(map);

      const popupContent = document.createElement("div");
      const title = document.createElement("strong");
      title.textContent = label;
      popupContent.appendChild(title);

      const coords = document.createElement("div");
      coords.textContent =
        "Latitude: " + lat.toFixed(7) +
        "\nLongitude: " + lng.toFixed(7);
      coords.style.whiteSpace = "pre-line";
      popupContent.appendChild(coords);

      if (Number.isFinite(accuracy)) {
        const accuracyText = document.createElement("div");
        accuracyText.textContent =
          "Reported accuracy: ±" + Math.round(accuracy) + " meters";
        popupContent.appendChild(accuracyText);

        accuracyCircle = L.circle([lat, lng], {
          radius: accuracy,
          color: "#1a73e8",
          fillColor: "#1a73e8",
          fillOpacity: 0.12,
          weight: 2
        }).addTo(map);
      }

      locationMarker.bindPopup(popupContent);

      setStatus(
        "Location: " + label +
        " | " + lat.toFixed(5) +
        ", " + lng.toFixed(5) +
        (Number.isFinite(accuracy)
          ? " | Accuracy ±" + Math.round(accuracy) + " m"
          : ""),
        "#188038"
      );

      showDiagnostics({
        Latitude: lat,
        Longitude: lng,
        "Reported accuracy": Number.isFinite(accuracy)
          ? accuracy + " meters"
          : "Not available",
        "Secure context": window.isSecureContext
      });
    }

    function tryAcquireLocation() {
      if (locationRequestInProgress) return;

      if (!window.isSecureContext) {
        setStatus(
          "This page is not in a secure context. Open the HTTPS GitHub Pages URL.",
          "#d93025"
        );
        showDiagnostics({
          "Page URL": location.href,
          "Secure context": window.isSecureContext
        });
        return;
      }

      if (!navigator.geolocation) {
        setStatus(
          "Geolocation is not supported by this browser.",
          "#d93025"
        );
        showDiagnostics({
          "Geolocation API": "Unavailable",
          "Browser": navigator.userAgent
        });
        return;
      }

      locationRequestInProgress = true;
      locateButton.disabled = true;
      setStatus("Requesting your device location...");

      navigator.geolocation.getCurrentPosition(
        position => {
          locationRequestInProgress = false;
          locateButton.disabled = false;

          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          console.log("GPS LATITUDE:", lat);
          console.log("GPS LONGITUDE:", lng);
          console.log("GPS ACCURACY:", accuracy, "meters");

          showPosition(lat, lng, "Device location", accuracy);
        },

        error => {
          locationRequestInProgress = false;
          locateButton.disabled = false;
          displayLocationError(error);
        },

        {
          enableHighAccuracy: true,
          timeout: 30000,
          maximumAge: 0
        }
      );
    }

    async function manualSearch() {
      const query = manualInput.value.trim();

      if (!query) {
        setStatus("Enter a city or ZIP code.", "#d93025");
        return;
      }

      searchButton.disabled = true;
      setStatus("Searching for location...");

      try {
        const url = new URL(
          "https://nominatim.openstreetmap.org/search"
        );

        url.searchParams.set("format", "jsonv2");
        url.searchParams.set("limit", "1");
        url.searchParams.set("q", query);

        const response = await fetch(url.toString(), {
          headers: {
            "Accept": "application/json"
          }
        });

        if (!response.ok) {
          throw new Error("Search HTTP status: " + response.status);
        }

        const results = await response.json();

        if (!results.length) {
          setStatus("Location not found. Try another search.", "#d93025");
          return;
        }

        const result = results[0];

        showPosition(
          Number(result.lat),
          Number(result.lon),
          result.display_name || query
        );

      } catch (error) {
        console.error("Search error:", error);

        setStatus(
          "Search failed: " + error.message,
          "#d93025"
        );

      } finally {
        searchButton.disabled = false;
      }
    }

    function toggleDiagnostics() {
      if (diagnostics.style.display === "block") {
        diagnostics.style.display = "none";
        return;
      }

      const info = {
        "Page URL": location.href,
        "HTTPS / secure context": window.isSecureContext,
        "Geolocation supported": Boolean(navigator.geolocation),
        "Online": navigator.onLine,
        "Browser": navigator.userAgent
      };

      if (navigator.permissions && navigator.permissions.query) {
        navigator.permissions.query({ name: "geolocation" })
          .then(result => {
            info["Location permission"] = result.state;
            showDiagnostics(info);
          })
          .catch(() => showDiagnostics(info));
      } else {
        info["Location permission"] = "Permission API unavailable";
        showDiagnostics(info);
      }
    }

    locateButton.addEventListener("click", tryAcquireLocation);
    searchButton.addEventListener("click", manualSearch);
    diagnosticButton.addEventListener("click", toggleDiagnostics);

    manualInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        manualSearch();
      }
    });
  </script>
</body>
</html>
