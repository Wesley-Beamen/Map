
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a73e8">
  <title>GPS Location Tracker</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    .map-container {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #e5e3df;
    }

    .control-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1000;
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
      width: 280px;
      max-width: calc(100vw - 70px);
    }

    button {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border: 0;
      border-radius: 5px;
      background: #1a73e8;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    #status {
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      color: #1a73e8;
    }

    #diagnostics {
      display: none;
      margin-top: 10px;
      padding: 8px;
      background: #f5f5f5;
      border-radius: 5px;
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .user-location-dot {
      width: 14px;
      height: 14px;
      background: #1a73e8;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 5px #555;
      position: relative;
      box-sizing: content-box;
    }

    .user-location-dot::after {
      content: "";
      position: absolute;
      inset: -3px;
      border: 3px solid #1a73e8;
      border-radius: 50%;
      animation: pulse-aura 2s infinite ease-out;
      box-sizing: content-box;
    }
    .avatar-marker {
  width: 46px;
  height: 46px;
  border: 3px solid white;
  border-radius: 50%;
  overflow: hidden;
  background: #1a73e8;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
}

.avatar-marker img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

    @keyframes pulse-aura {
      0% {
        transform: scale(1);
        opacity: .65;
      }
      100% {
        transform: scale(3.5);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .user-location-dot::after {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div class="map-container">
    <div style="margin-top:12px; border-top:1px solid #ddd; padding-top:12px;">
  <label for="avatar-file">Profile picture</label>

  <input
    id="avatar-file"
    type="file"
    accept="image/png,image/jpeg,image/webp"
  >

  <button id="upload-avatar" type="button">
    Upload Profile Picture
  </button>

  <div id="avatar-status" role="status"></div>
</div>

      <div id="status" role="status" aria-live="polite">
        Ready. Tap Locate Me to request your location.
      </div>

      <div style="margin-top:12px; border-top:1px solid #ddd; padding-top:12px;">
        <input
          id="manual-location"
          type="search"
          placeholder="Enter city or ZIP code"
          autocomplete="off"
        >

        <button id="search-button" type="button"
                style="background:#188038;">
          Search Location
        </button>
      </div>

      <button id="diagnostic-button" type="button"
              style="background:#5f6368;">
        Show Diagnostics
      </button>

      <div id="diagnostics"></div>
    </div>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    
let map;
let userMarker = null;
let accuracyCircle = null;
let locationWatchId = null;
let locationTimeout = null;
let profileAvatarUrl = null;

function setStatus(message) {
  const status = document.getElementById("status");
  if (status) {
    status.textContent = message;
  }
}

function initializeMap() {
  const mapElement = document.getElementById("map");

  if (!mapElement) {
    console.error('Missing <div id="map"></div>');
    setStatus("Error: Map container not found.");
    return;
  }

  if (typeof L === "undefined") {
    setStatus("Error: Leaflet failed to load. Check your internet connection.");
    console.error("Leaflet library is not loaded.");
    return;
  }

  // Prevent the map from being initialized more than once.
  if (map) {
    map.invalidateSize();
    return;
  }

  map = L.map("map").setView([39.8, -74.9], 15);

  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
  }).addTo(map);

  setStatus("Map ready. Tap Locate Me to find your location.");

  // Fix map sizing after the page has rendered.
  setTimeout(() => {
    map.invalidateSize();
  }, 300);
}
function createAvatarIcon(url) {
  const image = url
    ? `<img src="${url}" alt="Player location">`
    : `<div style="
        width:100%;height:100%;
        display:flex;align-items:center;
        justify-content:center;color:white;
        font-size:24px;">●</div>`;

  return L.divIcon({
    className: "",
    html: `<div class="avatar-marker">${image}</div>`,
    iconSize: [46, 46],
    iconAnchor: [23, 23],
    popupAnchor: [0, -23]
  });
}

window.setProfileAvatar = function(url) {
  profileAvatarUrl = url;

  if (userMarker) {
    userMarker.setIcon(createAvatarIcon(url));
  }
};

function showPosition(latitude, longitude, label, accuracy) {
  if (!map) {
    initializeMap();
  }

  if (!map) {
    setStatus("Map could not be initialized.");
    return;
  }

  const position = [latitude, longitude];

  if (!userMarker) {
  userMarker = L.marker(position, {
    icon: createAvatarIcon(profileAvatarUrl)
  }).addTo(map);
} else {
  userMarker.setLatLng(position);
  userMarker.setIcon(createAvatarIcon(profileAvatarUrl));
}

  userMarker.bindPopup(
    `<b>${label}</b><br>` +
    `Latitude: ${latitude.toFixed(6)}<br>` +
    `Longitude: ${longitude.toFixed(6)}<br>` +
    `Accuracy: ±${Math.round(accuracy)} meters`
  );

  if (!accuracyCircle) {
    accuracyCircle = L.circle(position, {
      radius: accuracy,
      color: "#1677ff",
      fillColor: "#1677ff",
      fillOpacity: 0.15,
      weight: 2
    }).addTo(map);
  } else {
    accuracyCircle.setLatLng(position);
    accuracyCircle.setRadius(accuracy);
  }

  map.setView(position, Math.max(map.getZoom(), 16));

  setStatus(
    `${label} — accuracy approximately ${Math.round(accuracy)} meters.`
  );

  console.log("GPS latitude:", latitude);
  console.log("GPS longitude:", longitude);
  console.log("GPS accuracy:", accuracy, "meters");
}

function tryAcquireLocation() {
  // Make sure the map is available first.
  initializeMap();

  if (!map) return;

  if (!("geolocation" in navigator)) {
    setStatus("Your browser does not support location services.");
    return;
  }

  if (!window.isSecureContext) {
    setStatus("Location requires a secure HTTPS website.");
    return;
  }

  // Stop an earlier tracking session.
  if (locationWatchId !== null) {
    navigator.geolocation.clearWatch(locationWatchId);
    locationWatchId = null;
  }

  if (locationTimeout !== null) {
    clearTimeout(locationTimeout);
    locationTimeout = null;
  }

  setStatus("Requesting location permission and GPS fix...");

  let receivedLocation = false;

  locationWatchId = navigator.geolocation.watchPosition(
    function (position) {
      receivedLocation = true;

      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      showPosition(
        latitude,
        longitude,
        "Your location",
        accuracy
      );
    },
    function (error) {
      let message;

      switch (error.code) {
        case error.PERMISSION_DENIED:
          message =
            "Location permission denied. Allow location access for this website in your browser settings.";
          break;

        case error.POSITION_UNAVAILABLE:
          message =
            "Your device cannot determine its location. Check Location Services.";
          break;

        case error.TIMEOUT:
          message =
            "Location request timed out. Try again somewhere with a clearer GPS signal.";
          break;

        default:
          message = "Location error: " + error.message;
      }

      setStatus(message);
      console.error("Geolocation error:", error.code, error.message);
    },
    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 30000
    }
  );

  // Keep live tracking active until the user stops it.
  // This timer only updates the status; it does not stop tracking.
  locationTimeout = setTimeout(() => {
    if (!receivedLocation) {
      setStatus(
        "Still waiting for your location. Check permissions and try again."
      );
    }
  }, 15000);
}

function stopTracking() {
  if (locationWatchId !== null) {
    navigator.geolocation.clearWatch(locationWatchId);
    locationWatchId = null;
  }

  if (locationTimeout !== null) {
    clearTimeout(locationTimeout);
    locationTimeout = null;
  }

  setStatus("Location tracking stopped.");
}

// Initialize when the page has loaded.
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initializeMap);
} else {
  initializeMap();
}

  </script>
  <script type="module" src="./profile.js"></script>
</body>
</html>
